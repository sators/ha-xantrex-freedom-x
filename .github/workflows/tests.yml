name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install ruff==0.17.2
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==2026.10.3
      - name: Install Bluetooth integration dependencies from HA manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys
          import homeassistant

          components = Path(homeassistant.__file__).parent / "components"
          seen = set()
          requirements = set()
          def visit(domain):
              if domain in seen:
                  return
              seen.add(domain)
              manifest = json.loads((components / domain / "manifest.json").read_text())
              requirements.update(manifest.get("requirements", []))
              for dependency in manifest.get("dependencies", []):
                  visit(dependency)
          visit("bluetooth_adapters")
          subprocess.run([sys.executable, "-m", "pip", "install", *sorted(requirements)], check=True)
          PY
      - run: python -m unittest discover -s tests_homeassistant -v
